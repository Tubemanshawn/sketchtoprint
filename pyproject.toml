[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchtoprint"
version = "0.1.0"
description = "Turn sketches and typed dimensions into printable parametric 3D models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.9",
    "trimesh>=4.0",
    "anthropic>=0.70",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sketchtoprint = "sketchtoprint.cli:main"

[tool.setuptools]
packages = ["sketchtoprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
